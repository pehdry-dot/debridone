name: DebridOne macOS dev build

# Builds UNSIGNED development DMGs for Apple Silicon and Intel, smoke-tests the app bundle and
# runs the Music self-test (real playback of every supported format) inside it.
# Nothing here signs or notarizes; see debridone/docs/BUILD.md for release signing.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Which Mac to build for"
        type: choice
        default: all
        options:
          - all
          - arm64
          - x86_64
  push:
    branches:
      - nuvio-rebuild
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: debridone-macos-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # The Music playback tests drive the real libmpv (silent output). With the variable below a
      # missing library fails the run instead of quietly skipping those tests.
      - name: Install libmpv for the Music playback tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmpv2
      # The Manga tests start the real extension host on the pinned Node.js build and load the real
      # Tiyo package (downloaded from the package registry by DebridOne's own installer).
      - name: Fetch the Node.js runtime for the Manga extension host
        run: ./scripts/debridone/fetch-node-runtime.sh linux-x64
      - name: Run DebridOne tests
        env:
          DEBRIDONE_REQUIRE_LIBMPV: "1"
          DEBRIDONE_REQUIRE_NODE: "1"
        run: >
          ./gradlew
          :debridone:platform:test
          :debridone:accounts:test
          :debridone:modules:music:test
          :debridone:modules:manga:test
          :debridone:architecture-tests:test
          --no-configuration-cache

  # Separate from the build on purpose: the Keychain binding can only be exercised on macOS, and a
  # failure here must be visible without holding back the installer.
  macos-platform-tests:
    name: macOS platform tests (Keychain)
    needs: tests
    # Not repeated when only one architecture was asked for by hand.
    if: github.event_name != 'workflow_dispatch' || inputs.arch == 'all'
    # The Keychain is the same on both architectures; the Intel runners are the ones with capacity.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Platform tests on macOS (includes the Keychain test)
        run: ./gradlew :debridone:platform:test --no-configuration-cache

  macos:
    name: macOS ${{ matrix.arch }} (${{ matrix.runner }})
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon is built on two images. GitHub's Apple Silicon runners are short on capacity
        # at times and a job that waits about 15 minutes without a machine is cancelled by GitHub
        # ("not acquired by Runner"); a second image doubles the chance of getting a build out of a
        # run. Both produce the same app. (macos-14 was retired by GitHub on 2 November 2026.)
        #
        # A manual run can ask for one architecture; a push builds all of them.
        include: ${{ fromJSON((inputs.arch == 'arm64' && '[{"runner":"macos-15","arch":"arm64","artifact":"DebridOne-macOS-arm64-dev"},{"runner":"macos-26","arch":"arm64","artifact":"DebridOne-macOS-arm64-dev-built-on-macos-26"}]') || (inputs.arch == 'x86_64' && '[{"runner":"macos-15-intel","arch":"x86_64","artifact":"DebridOne-macOS-x86_64-dev"}]') || '[{"runner":"macos-15","arch":"arm64","artifact":"DebridOne-macOS-arm64-dev"},{"runner":"macos-26","arch":"arm64","artifact":"DebridOne-macOS-arm64-dev-built-on-macos-26"},{"runner":"macos-15-intel","arch":"x86_64","artifact":"DebridOne-macOS-x86_64-dev"}]') }}
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      # Explicitly empty: this workflow must never sign or notarize.
      NUVIO_MACOS_SIGNING_IDENTITY: ""
      NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ""
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the macOS libmpv runtime
        run: ./scripts/debridone/fetch-macos-runtime.sh "${MACOS_ARCH}"

      # Manga's extensions are JavaScript: the app carries the pinned official Node.js build for
      # this architecture (checked against its published SHA-256) and never uses the runner's own.
      - name: Fetch the Node.js runtime for the Manga extension host
        run: ./scripts/debridone/fetch-node-runtime.sh "${MACOS_ARCH}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build unsigned DMG
        run: >
          ./gradlew
          :composeApp:packageReleaseDmg
          "-Pnuvio.macos.arch=${MACOS_ARCH}"
          -Pcompose.desktop.packaging.checkJdkVendor=false
          --no-configuration-cache
          --no-daemon
          --stacktrace

      - name: Smoke-test the app bundle
        run: |
          app="$(find composeApp/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -n 1)"
          test -d "${app}" || { echo "No .app bundle was produced." >&2; exit 1; }
          export DEBRIDONE_DATA_DIR="${RUNNER_TEMP}/debridone-data"
          export DEBRIDONE_CACHE_DIR="${RUNNER_TEMP}/debridone-cache"
          "${app}/Contents/MacOS/DebridOne" > "${RUNNER_TEMP}/debridone.log" 2>&1 &
          pid=$!
          sleep 45
          if ! kill -0 "${pid}" 2>/dev/null; then
            echo "DebridOne exited during start-up:" >&2
            cat "${RUNNER_TEMP}/debridone.log" >&2
            exit 1
          fi
          test -s "${DEBRIDONE_DATA_DIR}/accounts/accounts.db" || { echo "accounts.db was not created." >&2; cat "${RUNNER_TEMP}/debridone.log" >&2; exit 1; }
          for module in music manga; do
            test -s "${DEBRIDONE_DATA_DIR}/modules/${module}/${module}.db" || { echo "${module}.db was not created." >&2; exit 1; }
          done
          # Games is dormant: the application must not start it or create anything for it.
          if [ -e "${DEBRIDONE_DATA_DIR}/modules/gaming" ]; then
            echo "The application created a Games data folder although Games is not part of it." >&2
            exit 1
          fi
          kill "${pid}" || true
          echo "Smoke test passed: the app started and created its databases."

      # Inside the packaged app: reads a CBZ with no extension, starts the extension host on the
      # Node.js bundled in the app, installs Houdoku's real extension package (Tiyo) from the
      # package registry through the app's own verified installer, and reads a chapter through one
      # of Tiyo's sources against a stand-in server, including a restart and resume.
      - name: Manga self-test in the packaged app
        run: |
          app="$(find composeApp/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -n 1)"
          ls -l "${app}/Contents/app/resources/manga-host/" || { echo "The extension host is not in the app bundle." >&2; exit 1; }
          "${app}/Contents/app/resources/manga-host/node" --version
          codesign -dv "${app}/Contents/app/resources/manga-host/node" 2>&1 | sed 's/^/  /' || true
          "${app}/Contents/MacOS/DebridOne" --manga-self-test 2>&1 | tee "${RUNNER_TEMP}/manga-self-test.log"
          {
            echo "### Manga self-test (${MACOS_ARCH})"
            echo '```'
            sed -n '/^DebridOne Manga self-test/,$p' "${RUNNER_TEMP}/manga-self-test.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          grep -q "MANGA SELF-TEST PASSED" "${RUNNER_TEMP}/manga-self-test.log"

      # Imports the test audio files into a temporary library and plays one file of every format
      # from start to end through the libmpv inside the bundle, then restarts the Music engine and
      # checks that everything is still there. Silent output, so it does not depend on the runner
      # having a sound device. A format that does not play fails the build.
      - name: Music self-test in the packaged app
        env:
          DEBRIDONE_MUSIC_AO: "null"
        run: |
          app="$(find composeApp/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -n 1)"
          ls -l "${app}/Contents/app/resources/native/macos/" | grep -E "debridone_music_bridge|libmpv" || true
          "${app}/Contents/MacOS/DebridOne" --music-self-test "${GITHUB_WORKSPACE}/debridone/modules/music/src/test/resources/audio-fixtures" 2>&1 | tee "${RUNNER_TEMP}/music-self-test.log"
          {
            echo "### Music self-test (${MACOS_ARCH}, silent output)"
            echo '```'
            sed -n '/^DebridOne Music self-test/,$p' "${RUNNER_TEMP}/music-self-test.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The same test through the runner's real audio device, to see which output macOS gives the
      # engine. Informational: hosted runners are not guaranteed to have a sound device.
      - name: Music self-test with the default audio device (informational)
        continue-on-error: true
        run: |
          app="$(find composeApp/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -n 1)"
          "${app}/Contents/MacOS/DebridOne" --music-self-test "${GITHUB_WORKSPACE}/debridone/modules/music/src/test/resources/audio-fixtures" 2>&1 | tee "${RUNNER_TEMP}/music-self-test-device.log"
          {
            echo "### Music self-test (${MACOS_ARCH}, default audio device, informational)"
            echo '```'
            sed -n '/^DebridOne Music self-test/,$p' "${RUNNER_TEMP}/music-self-test-device.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report signature status
        run: |
          app="$(find composeApp/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' | head -n 1)"
          {
            echo "### Signature status (${MACOS_ARCH})"
            echo '```'
            codesign -dv --verbose=2 "${app}" 2>&1 || true
            spctl --assess --type execute -vv "${app}" 2>&1 || true
            echo '```'
            echo "This is an unsigned development build. Gatekeeper rejection above is expected."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          # The build writes the same DMG twice; upload only the final, architecture-named copy.
          path: composeApp/build/compose/release-dmgs/*.dmg
          if-no-files-found: error
          retention-days: 14
